<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ code }} · District Court</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing-body dark-theme login-page-body">
  <main class="login-page-main">
    <div class="dark-signin-card login-centered-card" style="text-align: center;">
      <div class="card-brand-tag">
        <span class="court-icon-badge">⚠️</span>
        <h2 style="font-size: 28px; margin-bottom: 8px;">Error {{ code }}</h2>
        <p>{{ message }}</p>
      </div>
      <div style="margin-top: 24px;">
        <a class="pill-btn primary-gradient-pill" href="{{ url_for('dashboard') }}">Return to Dashboard &rarr;</a>
      </div>
    </div>
  </main>
</body>
</html>
